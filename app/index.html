.pb,.pw,.cg{display:inline-block;white-space:nowrap;font:600 15px/1 Roboto,Arial,sans-serif}

.pw{background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:999px;padding:10px 18px}
.cg{background:#c4eed0;color:#0d652d;border-radius:8px;padding:8px 12px;font-weight:500}
.ko{color:var(--sub);font-size:14px}
.g img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin-top:4px}
.esc{display:none;background:#fff4d6;color:#4a3500;border:2px solid #f0b400;border-radius:16px;padding:16px;margin:0 0 14px}
.esc b{display:block;font-size:18px;margin-bottom:6px}
.esc a{display:block;text-align:center;margin-top:12px;background:#1b1530;color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:17px;text-decoration:none}
.sum{display:flex;gap:8px;margin:0 0 14px}
.sum div{flex:1;background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center;font-size:14px;color:var(--sub)}
.sum div b{display:block;font-size:20px;color:var(--p)}
.pre{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px;font-size:15px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 10px}
summary{font-weight:700;cursor:pointer}
details p{margin:10px 0 0}
